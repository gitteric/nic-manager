# Builds NicManager for x64 and x86 with MSYS2 MinGW-w64 (the same toolchain
# as the local presets) and publishes a GitHub release when a version tag is
# pushed:   git tag v1.0.0.0 && git push origin v1.0.0.0
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - arch: x64
            msystem: UCRT64
            pkg: ucrt-x86_64
          - arch: x86
            msystem: MINGW32
            pkg: i686
    steps:
      - uses: actions/checkout@v4

      - name: Version from tag
        shell: pwsh
        run: '"VERSION=$($env:GITHUB_REF_NAME.TrimStart(''v''))" >> $env:GITHUB_ENV'

      - uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: false
          install: >-
            mingw-w64-${{ matrix.pkg }}-gcc
            mingw-w64-${{ matrix.pkg }}-cmake
            mingw-w64-${{ matrix.pkg }}-ninja

      - name: Build
        shell: msys2 {0}
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DNICMGR_VERSION="$VERSION"
          cmake --build build
          mkdir -p out
          cp build/NicManager.exe "out/NicManager-$VERSION-${{ matrix.arch }}.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: NicManager-${{ matrix.arch }}
          path: out/*.exe

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          name: NicManager ${{ github.ref_name }}
          files: dist/*.exe
          generate_release_notes: true
