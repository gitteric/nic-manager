# Builds NicManager for x64 and x86 and publishes a GitHub release when a
# version tag is pushed:   git tag v1.2.0.0 && git push origin v1.2.0.0
#
# Both exes are cross-compiled on Ubuntu with MinGW-w64 (GCC, the same
# compiler family as the MSYS2 presets). MSYS2's 32-bit environment is being
# phased out, so the x86 build no longer depends on it.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            mingw: x86_64
          - arch: x86
            mingw: i686
    steps:
      - uses: actions/checkout@v5

      - name: Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mingw-w64 cmake ninja-build osslsigncode

      # Optional signing: with the secrets SIGNING_PFX_BASE64 and
      # SIGNING_PFX_PASSWORD set (see tools/make-cert.ps1) the exes are
      # signed; without them the release is built unsigned.
      - name: Signing key
        env:
          PFX: ${{ secrets.SIGNING_PFX_BASE64 }}
        run: |
          if [ -n "$PFX" ]; then
            mkdir -p signing
            echo "$PFX" | base64 -d > signing/nicmanager.pfx
          fi

      - name: Build
        env:
          NICMGR_SIGN_PASSWORD: ${{ secrets.SIGNING_PFX_PASSWORD }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_TOOLCHAIN_FILE=toolchain-mingw.cmake -DMINGW_ARCH=${{ matrix.mingw }} \
                -DNICMGR_VERSION="$VERSION"
          cmake --build build
          mkdir -p out
          cp build/NicManager.exe "out/NicManager-$VERSION-${{ matrix.arch }}.exe"
          rm -rf signing

      - uses: actions/upload-artifact@v4
        with:
          name: NicManager-${{ matrix.arch }}
          path: out/*.exe

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          name: NicManager ${{ github.ref_name }}
          files: dist/*.exe
          generate_release_notes: true
